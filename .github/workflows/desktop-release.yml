name: Desktop release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  dmg:
    runs-on: macos-14 # arm64
    # Cap the job so a hung tool (e.g. dylibbundler prompting with no stdin)
    # fails fast instead of burning the better part of an hour.
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-desktop-${{ runner.os }}-${{ hashFiles('flake.lock', 'nix/**', 'frontend/package-lock.json', 'agent-runner/package-lock.json') }}
          restore-prefixes-first-match: nix-desktop-${{ runner.os }}-

      # The app is linked by Xcode's toolchain; rustup reads rust-toolchain.toml.
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target"

      - name: Stage the frontend, agent runner and sidecars from the flake
        run: bash desktop/scripts/prepare-sidecars.sh

      # The Tauri CLI performs the bundling and ad-hoc signing, so it is
      # pinned via desktop/package.json rather than floated with npx: two
      # builds of the same tag must use the same tool.
      - name: Build .app and .dmg
        working-directory: desktop
        run: nix shell --inputs-from .. nixpkgs#nodejs --command sh -c 'npm ci && npx tauri build -- --locked'

      # Assets can only be attached to a draft: publishing makes the release
      # immutable.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --verify-tag --generate-notes
          gh release upload "$TAG" target/release/bundle/dmg/*.dmg --clobber
          gh release edit "$TAG" --draft=false
