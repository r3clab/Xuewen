apiVersion: apps/v1
kind: Deployment
metadata:
  name: xuewen
  labels: { app: xuewen }
spec:
  replicas: 1            # SQLite, Tantivy and the vector store are single-writer: never scale this up
  strategy:
    type: Recreate       # old pod must release /data before the new one mounts it
  selector:
    matchLabels: { app: xuewen }
  template:
    metadata:
      labels: { app: xuewen }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: xuewen
          image: ghcr.io/r3clab/xuewen   # tag pinned in kustomization.yaml
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - secretRef:
                name: xuewen-secrets
                optional: true   # keyword search works without the embedding key
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/xuewen
            - name: tmp
              mountPath: /tmp   # writable under the read-only root; daily TL;DR stages PDFs here
          startupProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 5
            failureThreshold: 60   # up to 5 min for migrations and opening the indexes
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet: { path: /api/stats, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 2Gi }   # vectors are held in this process
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: xuewen-data
        - name: config
          configMap:
            name: xuewen-config
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: xuewen
spec:
  selector: { app: xuewen }
  ports:
    - port: 8080
      targetPort: http
      name: http
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: xuewen-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
